server {
    listen 80;
    server_name localhost;

    # Carpeta donde Nginx buscará los archivos
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Soporte para rutas de Angular (SPA)
    # Si el archivo no existe ($uri), intenta con la carpeta ($uri/)
    # Si tampoco existe, redirige al index.html para que Angular maneje la ruta
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optimización de caché para imágenes y archivos estáticos
    # Esto ayuda a que el logo.png y favicon.ico carguen más rápido
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Manejo de errores (opcional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/errors;
    }
}